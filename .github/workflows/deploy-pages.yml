name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish trainer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check trainers
        run: |
          node --check feedback.js
          node --check glossary.js
          node --check app.js
          node --check case-trainer.js
          node --check all-questions.js
          node tests/check-glossary.cjs
          node tests/check-trainer.cjs
          node tests/check-case-trainer.cjs
          node tests/check-scenarios.cjs
          node tests/check-all-questions.cjs
          node --check wheel-visual.js
          node tests/check-topic-wheel.cjs
          node tests/check-wheel-visual.cjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css glossary.js app.js questions.json .nojekyll \
            senior.html ai-security.html scenarios.html all-questions.html all-questions.js case-trainer.js case-trainer.css \
            topic-wheel.html wheel-visual.js wheel-visual.css \
            senior-questions.json ai-security-questions.json scenarios-questions.json feedback.js feedback.css privacy.html _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
