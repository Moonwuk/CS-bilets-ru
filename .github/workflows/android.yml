name: Build Android APK and Google Play AAB

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/rustore-feedback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SIGNING_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.INFOSEC_SIGNING_KEY_BASE64 != '' && secrets.INFOSEC_SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check trainer
        run: |
          node --check app.js
          node --check android/googleplay-feedback.js
          node --check android/android-adapter.js
          node --check feedback.js
          node tests/check-glossary.cjs
          node tests/check-trainer.cjs
          node tests/check-case-trainer.cjs
          node tests/check-scenarios.cjs
          node tests/check-all-questions.cjs
          node --check wheel-visual.js
          node tests/check-topic-wheel.cjs
          node tests/check-wheel-visual.cjs
      - name: Install Android build tools
        run: python3 android/install-sdk.py --sdk-dir "$RUNNER_TEMP/infosec-sdk"
      - name: Install official bundletool
        run: python3 android/install-bundletool.py --tools-dir "$RUNNER_TEMP/infosec-tools"
      - name: Build unsigned APK for review
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          bash android/build.sh --unsigned
          bash android/build.sh --unsigned --store googleplay --format both
      - name: Prepare private signing files
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.INFOSEC_SIGNING_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.INFOSEC_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,base64,tempfile
          folder=Path(tempfile.mkdtemp(prefix="infosec-signing-",dir=os.environ["RUNNER_TEMP"]))
          key=folder/"release.jks"
          password=folder/"password.txt"
          key.write_bytes(base64.b64decode(os.environ["KEY_B64"],validate=True))
          password.write_text(os.environ["KEY_PASSWORD"]+"\n")
          key.chmod(0o600)
          password.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a") as env:
              env.write("INFOSEC_KEYSTORE="+str(key)+"\n")
              env.write("INFOSEC_PASSWORD_FILE="+str(password)+"\n")
          PY
      - name: Build signed release
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          bash android/build.sh
          bash android/build.sh --store googleplay --format both
      - name: Install pinned browser test client
        run: npm install --prefix "$RUNNER_TEMP/play-review" --no-save --ignore-scripts playwright@1.51.1
      - name: Review packaged Google Play screens
        env:
          NODE_PATH: ${{ runner.temp }}/play-review/node_modules
        run: |
          export GOOGLE_CHROME_BIN="$(command -v google-chrome)"
          node tests/check-googleplay-browser.cjs
      - name: Upload Google Play screenshots
        uses: actions/upload-artifact@v4
        with:
          name: infosec-googleplay-screenshots
          path: android/build/googleplay-screenshots/
          if-no-files-found: error
      - name: Upload Google Play review artifacts
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infosec-googleplay-unsigned
          path: android/build/outputs/googleplay/*-unsigned.*
          if-no-files-found: error
      - name: Upload Google Play release artifacts
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infosec-googleplay-release
          path: |
            android/build/outputs/googleplay/*.aab
            android/build/outputs/googleplay/*.apk
            android/build/outputs/googleplay/*.sha256
            !android/build/outputs/googleplay/*-unsigned.*
          if-no-files-found: error
      - name: Upload unsigned review artifact
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infosec-tickets-unsigned
          path: android/build/outputs/*-unsigned.apk
          if-no-files-found: error
      - name: Upload release artifact
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infosec-tickets-release
          path: |
            android/build/outputs/*.apk
            !android/build/outputs/*-unsigned.apk
            android/build/outputs/*.apk.sha256
          if-no-files-found: error
      - name: Remove temporary key
        if: always() && env.HAS_SIGNING_KEY == 'true'
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          path=os.environ.get("INFOSEC_KEYSTORE")
          if path:
              shutil.rmtree(Path(path).parent,ignore_errors=True)
          PY
